services:
  - type: web
    name: job-advert-decoder
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GROQ_API_KEY
        sync: false        # set this in the dashboard, never in this file
      - key: DATABASE_URL
        sync: false
